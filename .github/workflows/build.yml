name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle LX music SDK
        run: |
          if [ -f tools/bundle-lx-sdk/build.sh ]; then
            bash tools/bundle-lx-sdk/build.sh
          else
            echo "LX music SDK bundler not present yet, skipping"
          fi

      - name: Smoke test LX bundle
        run: |
          node -e "
            const fs=require('fs');const vm=require('vm');
            globalThis.navigator={userAgent:'node-smoke'};
            globalThis.window=globalThis;
            globalThis.__lx_native_call__=(k,a,p)=>'{}';
            globalThis.__lx_native_call__set_timeout=(id,ms)=>{};
            globalThis.__lx_native_call__utils_str2b64=(s)=>String(s);
            globalThis.__lx_native_call__utils_b642buf=(s)=>s;
            globalThis.__lx_native_call__utils_str2md5=(s)=>'';
            globalThis.__lx_native_call__utils_aes_encrypt=(m,d,k,iv)=>'';
            globalThis.__lx_native_call__utils_rsa_encrypt=(m,k)=>'';
            const src=fs.readFileSync('app/src/main/assets/lx/musicSdk.js','utf8');
            vm.runInThisContext(src, {filename:'musicSdk.js'});
            if (typeof globalThis.LxMusicSdk === 'undefined') { throw new Error('LX bundle 未暴露 LxMusicSdk'); }
            if (typeof globalThis.Buffer === 'undefined') { throw new Error('LX bundle 没有在模块体阶段安装 Buffer'); }
            console.log('LX bundle smoke ok');
          "

      - name: Unit tests
        run: |
          ./gradlew :feature-online-sources:testDebugUnitTest :feature-library-domain:testDebugUnitTest \
            --no-daemon --stacktrace

      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          find app/build/outputs -name "mapping.txt" -exec cp {} out/ \;
          ls -l out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: spicamusic-apk
          path: |
            out/*.apk
            out/mapping.txt
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android Lint
        run: ./gradlew :app:lintDebug :feature-online-sources:lintDebug --no-daemon

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: spicamusic-apk
          path: out

      - name: Rename APK for release
        run: |
          cd out
          for f in *.apk; do
            cp "$f" "spicamusic-${GITHUB_REF_NAME}-${f}"
          done
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/spicamusic-*.apk
          generate_release_notes: true
