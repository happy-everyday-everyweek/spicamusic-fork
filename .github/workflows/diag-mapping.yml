name: Diag mapping

on:
  push:
    branches:
      - diag-mapping
  workflow_dispatch:

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle LX music SDK
        run: bash tools/bundle-lx-sdk/build.sh

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect mapping
        run: |
          mkdir -p out
          find app/build/outputs -name "mapping.txt" -exec cp {} out/ \;
          ls -l out

      - name: Inspect mapping for crash frames
        run: |
          echo "===== class headers ====="
          for c in yg2 ks3 sb6 gi u41 ig hg qx5 vq3 kg hw2 d41; do
            line=$(grep -n -E " -> ${c}:" out/mapping.txt | head -1 | cut -d: -f1)
            if [ -n "$line" ]; then
              echo "----- frame ${c} -----"
              sed -n "${line},$((line+30))p" out/mapping.txt
            else
              echo "----- frame ${c}: not found -----"
            fi
          done

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: out/mapping.txt
          if-no-files-found: error
